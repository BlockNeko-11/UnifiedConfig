name: Build CI

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    strategy:
      matrix:
        java: [8]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: test
        if: github.ref != 'refs/heads/main'
        run: ./gradlew clean test --stacktrace --no-daemon

      - name: upload test reports if test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test Reports
          path: |
            gson/build/reports/tests/test/
            jackson/build/reports/tests/test/
            snakeyaml/build/reports/tests/test/
            toml4j/build/reports/tests/test/

      - name: build
        run: ./gradlew clean build -xtest --stacktrace --no-daemon

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            core/build/libs/
            gson/build/libs/
            jackson/build/libs/
            snakeyaml/build/libs/
            toml4j/build/libs/
